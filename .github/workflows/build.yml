name: 🚀 BITS-WRT

concurrency:
  group: amlogic-build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "Select Openwrt Version"
        required: true
        default: "openwrt:24.10.8"
        type: choice
        options:
          - openwrt:24.10.8
          - openwrt:25.12.5
      openwrt_kernel:
        description: "Select Kernel Version"
        required: false
        default: "6.6.y"
        type: choice
        options:
          - 6.6.y
          - 6.12.y
      variant:
        description: "Build Minimal / Standard"
        required: true
        default: "standard"
        type: choice
        options:
          - minimal
          - standard
      tunnel:
        description: "Select VPN Client"
        required: true
        default: "momo"
        type: choice
        options:
          - all
          - openclash
          - nikki
          - momo
          - openclash-nikki
          - openclash-momo
          - nikki-momo
          - openclash-nikki-momo
          - no-tunnel
      remote:
        description: "Remote Access"
        required: true
        default: "both"
        type: choice
        options:
          - no
          - tailscale
          - cloudflare
          - both
      container:
        description: "Container Runtime"
        required: true
        default: "no"
        type: choice
        options:
          - no
          - docker
          - podman
      addon:
        description: "Monitoring Tools"
        required: true
        default: "no"
        type: choice
        options:
          - no
          - bandix
          - bot
          - both
      clean:
        description: "Clean Build"
        required: false
        default: "true"
        type: boolean

env:
  RELEASE_BRANCH: ${{ inputs.openwrt_version }}
  VARIANT: ${{ inputs.variant }}
  TUNNEL: ${{ inputs.tunnel }}
  # Single source of truth untuk semua kombinasi tunnel yang bisa di-build.
  # "all" = meta-selector, di-resolve jadi list ini di step Build Variables.
  TUNNEL_LIST: "openclash nikki momo openclash-nikki openclash-momo nikki-momo openclash-nikki-momo no-tunnel"
  CLEAN: ${{ inputs.clean }}
  REMOTE: ${{ inputs.remote }}
  CONTAINER: ${{ inputs.container }}
  ADDON: ${{ inputs.addon }}
  TZ: Asia/Jakarta
  WORKING_DIR: imagebuilder
  DEBIAN_FRONTEND: noninteractive

jobs:
  check-compatibility:
    name: 🛡️ Compatibility Check
    runs-on: ubuntu-22.04
    outputs:
      status: ${{ steps.compatibility.outputs.status }}

    steps:
      - name: 🔍 Check Requirements
        id: compatibility
        run: |
          echo "::group::Runner"
          echo "CPU : $(uname -m)"
          echo "RAM : $(free -h | awk '/Mem:/{print $2}')"
          echo "Disk: $(df -h / | awk 'NR==2{print $4}') free"
          echo "::endgroup::"
          echo "::group::Build Config"
          echo "openwrt_version : ${{ env.RELEASE_BRANCH }}"
          echo "kernel          : ${{ inputs.openwrt_kernel }}"
          echo "variant         : ${{ env.VARIANT }}"
          echo "tunnel          : ${{ env.TUNNEL }}"
          echo "remote          : ${{ env.REMOTE }}"
          echo "container       : ${{ env.CONTAINER }}"
          echo "addon           : ${{ env.ADDON }}"
          echo "clean           : ${{ env.CLEAN }}"
          echo "::endgroup::"
          echo "status=success" >> $GITHUB_OUTPUT

  build-firmware:
    name: 🏗️ Build Firmware
    needs: check-compatibility
    if: needs.check-compatibility.outputs.status == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: ⚙️ Initialize
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -y update
          sudo -E apt-get -y install \
            ack antlr3 aria2 asciidoc autoconf automake autopoint binutils bison \
            btrfs-progs build-essential bzip2 ca-certificates ccache cmake coreutils cpio curl \
            device-tree-compiler fastjar flex g++-multilib gawk gcc-multilib gettext git git-core \
            gperf gzip haveged help2man intltool jq libc6-dev-i386 libelf-dev libfuse-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev \
            libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool libz-dev lrzsz \
            mkisofs msmtp nano ninja-build ntpdate p7zip p7zip-full patch pigz pkgconf python3 \
            python3-pip python3-pyelftools python3-setuptools qemu-utils rsync scons \
            squashfs-tools swig tar texinfo uglifyjs unzip upx upx-ucl vim wget xmlto xsltproc \
            xxd xz-utils yasm zip zlib1g-dev zstd
          sudo timedatectl set-timezone "${TZ}"
          echo "status=success" >> "${GITHUB_OUTPUT}"

      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          path: origin
          fetch-depth: 1

      - name: 🧩 Build Variables
        id: variables
        run: |
          echo "openwrt_board=s905x_s905x-b860h" >> $GITHUB_ENV
          echo "PROFILE=generic" >> $GITHUB_ENV
          echo "TARGET_SYSTEM=armsr/armv8" >> $GITHUB_ENV
          echo "TARGET_NAME=armsr-armv8" >> $GITHUB_ENV
          echo "ARCH_1=arm64" >> $GITHUB_ENV
          echo "ARCH_3=aarch64_generic" >> $GITHUB_ENV

          # Set base distribution info
          BASE="${RELEASE_BRANCH%:*}"
          BRANCH="${RELEASE_BRANCH#*:}"
          VEROP="$(echo "${BRANCH}" | awk -F. '{print $1"."$2}')"

          echo "BASE=$BASE" >> $GITHUB_ENV
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "VEROP=$VEROP" >> $GITHUB_ENV
          echo "DOWNLOAD_BASE=https://downloads.${BASE}.org" >> $GITHUB_ENV

          # Set date variable
          echo "DATE=$(date +'%d%m%Y')" >> $GITHUB_ENV

          # Resolve tunnel selection: "all" -> full list, else single value (validated)
          if [[ "$TUNNEL" == "all" ]]; then
            TUNNEL_SELECTED="$TUNNEL_LIST"
          elif [[ " $TUNNEL_LIST " == *" $TUNNEL "* ]]; then
            TUNNEL_SELECTED="$TUNNEL"
          else
            echo "::error::Unknown tunnel option: $TUNNEL (valid: all, $TUNNEL_LIST)"
            exit 1
          fi
          echo "TUNNEL_SELECTED=$TUNNEL_SELECTED" >> $GITHUB_ENV
          echo "Selected tunnel(s): $TUNNEL_SELECTED"

          echo "Build variables configured successfully"
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 📥 Image Builder
        id: download
        if: steps.variables.outputs.status == 'success'
        run: |
          # ImageBuilder archive: 24.10+ and 25.x use zst, older use xz
          CURVER=$(echo "$BRANCH" | cut -d'.' -f1)
          if [ "$CURVER" -ge 24 ]; then archive_ext="tar.zst"; else archive_ext="tar.xz"; fi

          # Download image builder
          RELEASE="${{ env.DOWNLOAD_BASE }}/releases/${{ env.BRANCH }}/targets/${{ env.TARGET_SYSTEM }}/${{ env.BASE }}-imagebuilder-${{ env.BRANCH }}-${{ env.TARGET_NAME }}.Linux-x86_64.${archive_ext}"
          echo "Downloading from: $RELEASE"
          wget --progress=dot:giga "$RELEASE"

          # Extract archive
          case "${archive_ext}" in
            tar.xz)
              tar -xJf *-imagebuilder-* && rm -f *-imagebuilder-*.tar.xz
              ;;
            tar.zst)
              tar --use-compress-program=unzstd -xf *-imagebuilder-* && rm -f *-imagebuilder-*.tar.zst
              ;;
          esac

          # Setup working directory
          mv *-imagebuilder-* ${{ env.WORKING_DIR }}
          cp -r $GITHUB_WORKSPACE/origin/* $GITHUB_WORKSPACE/${{ env.WORKING_DIR }}

          echo "Image builder prepared successfully"
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 📦 Packages
        id: packages
        if: steps.download.outputs.status == 'success'
        run: |
          cd ${{ env.WORKING_DIR }}
          chmod +x scripts/packages.sh
          ./scripts/packages.sh

          PACKAGE_COUNT=$(find packages -type f -name "*.ipk" | wc -l)
          echo "Downloaded $PACKAGE_COUNT external packages"
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 🛠️ Patches
        id: customize
        if: steps.packages.outputs.status == 'success'
        run: |
          cd ${{ env.WORKING_DIR }}

          # Apply patches
          chmod +x scripts/patch.sh
          ./scripts/patch.sh

          # Configure tunnel apps (per selected tunnel; script is idempotent)
          chmod +x scripts/tunnel.sh
          for tunnel in $TUNNEL_SELECTED; do
            ./scripts/tunnel.sh "$tunnel"
          done

          echo "Customizations applied successfully"
          df -hT ${PWD}
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 🏗️ Build Images
        id: build
        if: steps.customize.outputs.status == 'success'
        run: |
          cd ${{ env.WORKING_DIR }}
          mkdir -p compiled_images
          chmod +x make-image.sh

          build_image() {
            local tunnel=$1
            echo "Building with VPN Client: $tunnel"
            
            # Clean if requested
            if [ "${{ env.CLEAN }}" == "true" ]; then
              make clean
            fi
            
            # Build image
            time ./make-image.sh ${{ env.PROFILE }} $tunnel ${{ env.VARIANT }} ${{ env.REMOTE }} ${{ env.CONTAINER }} ${{ env.ADDON }}
            
            # Move and rename output files
            for file in bin/targets/"${{ env.TARGET_SYSTEM }}"/*rootfs.tar.gz; do
              if [ -f "$file" ]; then
                new_name="BITS-WRT_$(basename "$file" .tar.gz)_${tunnel}.tar.gz"
                mv "$file" compiled_images/$new_name
              fi
            done
          }

          for tunnel in $TUNNEL_SELECTED; do
            build_image $tunnel
          done

          echo "Images built successfully:"
          ls -la compiled_images/
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 📦 Package Images
        id: package
        if: steps.build.outputs.status == 'success'
        run: |
          cd ${{ env.WORKING_DIR }}

          package_image() {
            local tunnel=$1
            echo "Packaging images for: $tunnel"
            
            git clone --depth 1 https://github.com/ophub/amlogic-s9xxx-openwrt.git
            mkdir -p amlogic-s9xxx-openwrt/openwrt-armvirt
            
            for file in compiled_images/*_${tunnel}.tar.gz; do
              if [ -f "$file" ]; then
                mv "$file" amlogic-s9xxx-openwrt/openwrt-armvirt/BITS-WRT_openwrt-armsr-armv8-generic-rootfs.tar.gz
                cd amlogic-s9xxx-openwrt
                sudo ./remake -b ${{ env.openwrt_board }} -k ${{ inputs.openwrt_kernel }} -s 1024
                
                # Cari file output dan pindahkan
                find ./openwrt/out/ -name "*.img.gz" | while read FILE_PATH; do
                  if [ -n "$FILE_PATH" ]; then
                    NEW_NAME="BITS-WRT_$(basename "$FILE_PATH" .img.gz)_${tunnel}.img.gz"
                    sudo mv "$FILE_PATH" "$GITHUB_WORKSPACE/${{ env.WORKING_DIR }}/compiled_images/$NEW_NAME"
                  fi
                done
                
                # Kembali ke directory awal
                cd $GITHUB_WORKSPACE/${{ env.WORKING_DIR }}
              fi
            done
            
            sudo rm -rf amlogic-s9xxx-openwrt
          }

          for tunnel in $TUNNEL_SELECTED; do
            package_image $tunnel
          done

          echo "Images packaged successfully"
          echo "status=success" >> $GITHUB_OUTPUT
          ls -la compiled_images/

      - name: 💾 Mod SDCard
        id: modsdcard
        if: steps.package.outputs.status == 'success'
        run: |
          cd ${{ env.WORKING_DIR }}

          chmod +x scripts/modsdcard.sh
          if [[ "$(find "$GITHUB_WORKSPACE/${{ env.WORKING_DIR }}/compiled_images" -name "*_s905x_*.img.gz")" ]]; then
            ./scripts/modsdcard.sh
          fi
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 📋 Build Summary
        if: steps.modsdcard.outputs.status == 'success'
        run: |
          echo "::group::Artifacts"
          ls -la "${{ env.WORKING_DIR }}/compiled_images/"*.gz 2>/dev/null || ls -la "${{ env.WORKING_DIR }}/compiled_images/"
          echo "::endgroup::"
          echo "board : ${{ env.openwrt_board }}"
          echo "branch: ${{ env.BRANCH }} (${{ env.VEROP }})"
          echo "kernel: ${{ inputs.openwrt_kernel }}"

      - name: 🚀 Release
        if: steps.modsdcard.outputs.status == 'success'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "bitswrt-amlogic-${{ env.BRANCH }}"
          name: BITS-WRT-Amlogic-${{ env.BRANCH }}-${{ env.TUNNEL }}-${{ env.DATE }}
          files: ${{ env.WORKING_DIR }}/compiled_images/*.gz
          prerelease: true
          generate_release_notes: true
