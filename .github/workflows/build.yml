name: 🚀 BITS-WRT

concurrency:
  group: amlogic-build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      board:
        description: "Select Device"
        required: true
        default: "HG680P"
        type: choice
        options:
          - HG680P
          - B860H
      openwrt_version:
        description: "Select OpenWrt Version"
        required: true
        default: "OpenWrt 23.05 (opkg)"
        type: choice
        options:
          - OpenWrt 23.05 (opkg)
          - OpenWrt 24.10 (apk)
          - OpenWrt 25.12 (apk)
      openwrt_kernel:
        description: "Select Kernel Version"
        required: false
        default: "Kernel 6.6"
        type: choice
        options:
          - Kernel 6.6
          - Kernel 6.12
      variant:
        description: "Select Build Variant"
        required: true
        default: "Standard"
        type: choice
        options:
          - Minimal
          - Standard
      tunnel:
        description: "Select VPN Client"
        required: true
        default: "Momo"
        type: choice
        options:
          - All In One
          - OpenClash
          - Nikki
          - Momo
          - OpenClash + Nikki
          - OpenClash + Momo
          - Nikki + Momo
          - OpenClash + Nikki + Momo
          - No Tunnel
      remote:
        description: "Select Remote Access"
        required: true
        default: "Tailscale + Cloudflare"
        type: choice
        options:
          - No Remote
          - Tailscale
          - Cloudflare
          - Tailscale + Cloudflare
      container:
        description: "Select Container Runtime"
        required: true
        default: "No Runtime"
        type: choice
        options:
          - No Runtime
          - Docker
          - Podman
      addon:
        description: "Select Monitoring Tools"
        required: true
        default: "No Monitoring"
        type: choice
        options:
          - No Monitoring
          - Bandix
          - BITS Bot
          - Bandix + BITS Bot
      mod_sdcard:
        description: "Select Mod SD Card"
        required: true
        default: "Yes"
        type: choice
        options:
          - "Yes"
          - "No"
      clean:
        description: "Select Clean Build"
        required: true
        default: "Yes"
        type: choice
        options:
          - "Yes"
          - "No"

env:
  # Single source of truth for all valid tunnel combinations.
  # "all" is a meta-selector, resolved to "openclash-nikki-momo" in the Build Variables step.
  TUNNEL_LIST: "openclash nikki momo openclash-nikki openclash-momo nikki-momo openclash-nikki-momo no-tunnel"
  TZ: Asia/Jakarta
  WORKING_DIR: imagebuilder
  DEBIAN_FRONTEND: noninteractive

jobs:
  check-compatibility:
    name: 🛡️ Compatibility Check
    runs-on: ubuntu-22.04
    outputs:
      status: ${{ steps.compatibility.outputs.status }}

    steps:
      - name: 🔍 Check Compatibility
        id: compatibility
        run: |
          echo "::group::Runner"
          echo "CPU : $(uname -m)"
          echo "RAM : $(free -h | awk '/Mem:/{print $2}')"
          echo "Disk: $(df -h / | awk 'NR==2{print $4}') free"
          echo "::endgroup::"
          echo "::group::Build Config"
          echo "board           : ${{ inputs.board }}"
          echo "openwrt_version : ${{ inputs.openwrt_version }}"
          echo "openwrt_kernel  : ${{ inputs.openwrt_kernel }}"
          echo "variant         : ${{ inputs.variant }}"
          echo "tunnel          : ${{ inputs.tunnel }}"
          echo "remote          : ${{ inputs.remote }}"
          echo "container       : ${{ inputs.container }}"
          echo "addon           : ${{ inputs.addon }}"
          echo "mod_sdcard      : ${{ inputs.mod_sdcard }}"
          echo "clean           : ${{ inputs.clean }}"
          echo "::endgroup::"
          echo "status=success" >> $GITHUB_OUTPUT

  build-firmware:
    name: 🏗️ Build Firmware
    needs: check-compatibility
    if: needs.check-compatibility.outputs.status == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: ⚙️ Initialize
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -y update
          sudo -E apt-get -y install \
            ack antlr3 aria2 asciidoc autoconf automake autopoint binutils bison \
            btrfs-progs build-essential bzip2 ca-certificates ccache cmake coreutils cpio curl \
            device-tree-compiler fastjar flex g++-multilib gawk gcc-multilib gettext git git-core \
            gperf gzip haveged help2man intltool jq libc6-dev-i386 libelf-dev libfuse-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev \
            libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool libz-dev lrzsz \
            mkisofs msmtp nano ninja-build ntpdate p7zip p7zip-full patch pigz pkgconf python3 \
            python3-pip python3-pyelftools python3-setuptools qemu-utils rsync scons \
            squashfs-tools swig tar texinfo uglifyjs unzip upx upx-ucl vim wget xmlto xsltproc \
            xxd xz-utils yasm zip zlib1g-dev zstd
          sudo timedatectl set-timezone "${TZ}"
          echo "status=success" >> "${GITHUB_OUTPUT}"

      - name: 🧾 Checkout
        uses: actions/checkout@v7
        with:
          path: origin
          fetch-depth: 1

      - name: 🧩 Build Variables
        id: variables
        run: |
          # Map user-friendly labels -> internal values
          case "${{ inputs.board }}" in
            HG680P) BOARD="HG680P"; openwrt_board="s905x" ;;
            B860H)  BOARD="B860H";  openwrt_board="s905x-b860h" ;;
          esac
          case "${{ inputs.openwrt_version }}" in
            "OpenWrt 23.05 (opkg)") RELEASE_BRANCH="openwrt:23.05.5" ;;
            "OpenWrt 24.10 (apk)")  RELEASE_BRANCH="openwrt:24.10.8" ;;
            "OpenWrt 25.12 (apk)")  RELEASE_BRANCH="openwrt:25.12.5" ;;
          esac
          case "${{ inputs.openwrt_kernel }}" in
            "Kernel 6.6")  KERNEL="6.6.y" ;;
            "Kernel 6.12") KERNEL="6.12.y" ;;
          esac
          case "${{ inputs.variant }}" in
            "Minimal")  VARIANT="minimal" ;;
            "Standard") VARIANT="standard" ;;
          esac
          case "${{ inputs.tunnel }}" in
            "All In One")               TUNNEL="all" ;;
            "OpenClash")                TUNNEL="openclash" ;;
            "Nikki")                    TUNNEL="nikki" ;;
            "Momo")                     TUNNEL="momo" ;;
            "OpenClash + Nikki")        TUNNEL="openclash-nikki" ;;
            "OpenClash + Momo")         TUNNEL="openclash-momo" ;;
            "Nikki + Momo")             TUNNEL="nikki-momo" ;;
            "OpenClash + Nikki + Momo") TUNNEL="openclash-nikki-momo" ;;
            "No Tunnel")                TUNNEL="no-tunnel" ;;
          esac
          case "${{ inputs.remote }}" in
            "No Remote")               REMOTE="no" ;;
            "Tailscale")               REMOTE="tailscale" ;;
            "Cloudflare")              REMOTE="cloudflare" ;;
            "Tailscale + Cloudflare")  REMOTE="both" ;;
          esac
          case "${{ inputs.container }}" in
            "No Runtime") CONTAINER="no" ;;
            "Docker")     CONTAINER="docker" ;;
            "Podman")     CONTAINER="podman" ;;
          esac
          case "${{ inputs.addon }}" in
            "No Monitoring")     ADDON="no" ;;
            "Bandix")            ADDON="bandix" ;;
            "BITS Bot")          ADDON="bot" ;;
            "Bandix + BITS Bot") ADDON="both" ;;
          esac
          case "${{ inputs.mod_sdcard }}" in
            "Yes") MOD_SDCARD="true" ;;
            "No")  MOD_SDCARD="false" ;;
          esac
          case "${{ inputs.clean }}" in
            "Yes") CLEAN="true" ;;
            "No")  CLEAN="false" ;;
          esac

          echo "BOARD=$BOARD" >> $GITHUB_ENV
          echo "openwrt_board=$openwrt_board" >> $GITHUB_ENV
          echo "RELEASE_BRANCH=$RELEASE_BRANCH" >> $GITHUB_ENV
          echo "KERNEL=$KERNEL" >> $GITHUB_ENV
          echo "VARIANT=$VARIANT" >> $GITHUB_ENV
          echo "TUNNEL=$TUNNEL" >> $GITHUB_ENV
          echo "REMOTE=$REMOTE" >> $GITHUB_ENV
          echo "CONTAINER=$CONTAINER" >> $GITHUB_ENV
          echo "ADDON=$ADDON" >> $GITHUB_ENV
          echo "MOD_SDCARD=$MOD_SDCARD" >> $GITHUB_ENV
          echo "CLEAN=$CLEAN" >> $GITHUB_ENV

          echo "PROFILE=generic" >> $GITHUB_ENV
          echo "TARGET_SYSTEM=armsr/armv8" >> $GITHUB_ENV
          echo "TARGET_NAME=armsr-armv8" >> $GITHUB_ENV
          echo "ARCH_1=arm64" >> $GITHUB_ENV
          echo "ARCH_3=aarch64_generic" >> $GITHUB_ENV

          # Set base distribution info
          BASE="${RELEASE_BRANCH%:*}"
          BRANCH="${RELEASE_BRANCH#*:}"
          VEROP="$(echo "${BRANCH}" | awk -F. '{print $1"."$2}')"

          echo "BASE=$BASE" >> $GITHUB_ENV
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "VEROP=$VEROP" >> $GITHUB_ENV
          echo "DOWNLOAD_BASE=https://downloads.${BASE}.org" >> $GITHUB_ENV

          # Package manager: apk for OpenWrt >= 24.10, opkg otherwise
          MAJOR="$(echo "${BRANCH}" | cut -d'.' -f1)"
          if [ "${MAJOR}" -ge 24 ]; then USE_APK="true"; PKG_EXT="apk"; else USE_APK="false"; PKG_EXT="ipk"; fi
          echo "USE_APK=${USE_APK}" >> $GITHUB_ENV
          echo "PKG_EXT=${PKG_EXT}" >> $GITHUB_ENV

          # Set date variable
          echo "DATE=$(date +'%d%m%Y')" >> $GITHUB_ENV

          # Resolve tunnel selection: "all" -> all-in-one image, else single value (validated)
          if [[ "$TUNNEL" == "all" ]]; then
            TUNNEL_SELECTED="openclash-nikki-momo"
          elif [[ " $TUNNEL_LIST " == *" $TUNNEL "* ]]; then
            TUNNEL_SELECTED="$TUNNEL"
          else
            echo "::error::Unknown tunnel option: $TUNNEL (valid: all, $TUNNEL_LIST)"
            exit 1
          fi
          echo "TUNNEL_SELECTED=$TUNNEL_SELECTED" >> $GITHUB_ENV
          echo "Selected tunnel(s): $TUNNEL_SELECTED"

          echo "Build variables configured successfully"
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 📥 Image Builder
        id: download
        if: steps.variables.outputs.status == 'success'
        run: |
          # ImageBuilder archive: 24.10+ and 25.x use zst, older use xz
          CURVER=$(echo "$BRANCH" | cut -d'.' -f1)
          if [ "$CURVER" -ge 24 ]; then archive_ext="tar.zst"; else archive_ext="tar.xz"; fi

          # Download image builder
          RELEASE="${{ env.DOWNLOAD_BASE }}/releases/${{ env.BRANCH }}/targets/${{ env.TARGET_SYSTEM }}/${{ env.BASE }}-imagebuilder-${{ env.BRANCH }}-${{ env.TARGET_NAME }}.Linux-x86_64.${archive_ext}"
          echo "Downloading from: $RELEASE"
          wget --progress=dot:giga "$RELEASE"

          # Extract archive
          case "${archive_ext}" in
            tar.xz)
              tar -xJf *-imagebuilder-* && rm -f *-imagebuilder-*.tar.xz
              ;;
            tar.zst)
              tar --use-compress-program=unzstd -xf *-imagebuilder-* && rm -f *-imagebuilder-*.tar.zst
              ;;
          esac

          # Setup working directory
          mv *-imagebuilder-* ${{ env.WORKING_DIR }}
          cp -r $GITHUB_WORKSPACE/origin/* $GITHUB_WORKSPACE/${{ env.WORKING_DIR }}

          echo "Image builder prepared successfully"
          echo "status=success" >> $GITHUB_OUTPUT

      - name: ⬇️ Download Packages
        id: packages
        if: steps.download.outputs.status == 'success'
        run: |
          cd ${{ env.WORKING_DIR }}
          chmod +x scripts/packages.sh
          ./scripts/packages.sh

          PACKAGE_COUNT=$(find packages -type f -name "*.${PKG_EXT}" | wc -l)
          echo "Downloaded $PACKAGE_COUNT external packages"
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 🛠️ Patches
        id: customize
        if: steps.packages.outputs.status == 'success'
        run: |
          cd ${{ env.WORKING_DIR }}

          # Apply patches
          chmod +x scripts/patch.sh
          ./scripts/patch.sh

          # Configure tunnel apps (per selected tunnel; script is idempotent)
          chmod +x scripts/tunnel.sh
          for tunnel in $TUNNEL_SELECTED; do
            ./scripts/tunnel.sh "$tunnel"
          done

          echo "Customizations applied successfully"
          df -hT ${PWD}
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 🏗️ Build Images
        id: build
        if: steps.customize.outputs.status == 'success'
        run: |
          cd ${{ env.WORKING_DIR }}
          mkdir -p compiled_images
          chmod +x make-image.sh

          build_image() {
            local tunnel=$1
            echo "Building with VPN Client: $tunnel"

            # Clean if requested
            if [ "${{ env.CLEAN }}" == "true" ]; then
              make clean
            fi

            # Build image
            time ./make-image.sh ${{ env.PROFILE }} $tunnel ${{ env.VARIANT }} ${{ env.REMOTE }} ${{ env.CONTAINER }} ${{ env.ADDON }}

            # Move and rename output files
            for file in bin/targets/"${{ env.TARGET_SYSTEM }}"/*rootfs.tar.gz; do
              if [ -f "$file" ]; then
                new_name="BITS-WRT_$(basename "$file" .tar.gz)_${tunnel}.tar.gz"
                mv "$file" compiled_images/$new_name
              fi
            done
          }

          for tunnel in $TUNNEL_SELECTED; do
            build_image $tunnel
          done

          echo "Images built successfully:"
          ls -la compiled_images/
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 📦 Package Images
        id: package
        if: steps.build.outputs.status == 'success'
        run: |
          cd ${{ env.WORKING_DIR }}

          package_image() {
            local tunnel=$1
            echo "Packaging images for: $tunnel"

            git clone --depth 1 https://github.com/ophub/amlogic-s9xxx-openwrt.git
            mkdir -p amlogic-s9xxx-openwrt/openwrt-armvirt

            for file in compiled_images/*_${tunnel}.tar.gz; do
              if [ -f "$file" ]; then
                mv "$file" amlogic-s9xxx-openwrt/openwrt-armvirt/BITS-WRT_openwrt-armsr-armv8-generic-rootfs.tar.gz
                cd amlogic-s9xxx-openwrt
                sudo ./remake -b ${{ env.openwrt_board }} -k ${{ env.KERNEL }} -s 1024

                # Convert to xz and name output images
                find ./openwrt/out/ -name "*.img.gz" | while read FILE_PATH; do
                  if [ -n "$FILE_PATH" ]; then
                    KVER="$(basename "$FILE_PATH" | sed -nE 's/.*_k([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')"

                    FEATURES="${tunnel}"
                    case "$REMOTE" in
                      tailscale)  FEATURES+="-ts" ;;
                      cloudflare) FEATURES+="-cf" ;;
                      both)       FEATURES+="-ts-cf" ;;
                    esac
                    case "$CONTAINER" in
                      docker) FEATURES+="-docker" ;;
                      podman) FEATURES+="-podman" ;;
                    esac
                    case "$ADDON" in
                      bandix) FEATURES+="-bandix" ;;
                      bot)    FEATURES+="-bot" ;;
                      both)   FEATURES+="-bandix-bot" ;;
                    esac

                    SUFFIX=""
                    [ "$MOD_SDCARD" == "true" ] && SUFFIX="_mod"
                    NEW_NAME="BITS-WRT_${BRANCH}_${BOARD}_k${KVER}_${FEATURES}_${VARIANT}${SUFFIX}.img.xz"
                    sudo gunzip -c "$FILE_PATH" | xz -T0 > "$GITHUB_WORKSPACE/${{ env.WORKING_DIR }}/compiled_images/$NEW_NAME"
                  fi
                done

                # Return to working directory
                cd $GITHUB_WORKSPACE/${{ env.WORKING_DIR }}
              fi
            done

            sudo rm -rf amlogic-s9xxx-openwrt
          }

          for tunnel in $TUNNEL_SELECTED; do
            package_image $tunnel
          done

          echo "Images packaged successfully"
          echo "status=success" >> $GITHUB_OUTPUT
          ls -la compiled_images/

      - name: 💾 Modify SD Card
        id: modsdcard
        if: steps.package.outputs.status == 'success'
        run: |
          cd ${{ env.WORKING_DIR }}

          if [ "${{ env.MOD_SDCARD }}" == "true" ]; then
            chmod +x scripts/modsdcard.sh
            if [[ "$(find "$GITHUB_WORKSPACE/${{ env.WORKING_DIR }}/compiled_images" -name "*.img.xz" -print -quit)" ]]; then
              ./scripts/modsdcard.sh
            fi
          else
            echo "Mod SD Card skipped"
          fi
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 📋 Build Summary
        if: steps.modsdcard.outputs.status == 'success'
        run: |
          echo "::group::Artifacts"
          ls -la "${{ env.WORKING_DIR }}/compiled_images/"*.xz 2>/dev/null || ls -la "${{ env.WORKING_DIR }}/compiled_images/"
          echo "::endgroup::"
          echo "board : ${{ env.openwrt_board }}"
          echo "branch: ${{ env.BRANCH }} (${{ env.VEROP }})"
          echo "kernel: ${{ env.KERNEL }}"

      - name: 🚀 Release
        if: steps.modsdcard.outputs.status == 'success'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "bitswrt-amlogic-${{ env.BRANCH }}"
          name: BITS-WRT-Amlogic-${{ env.BRANCH }}-${{ env.TUNNEL }}-${{ env.DATE }}
          files: ${{ env.WORKING_DIR }}/compiled_images/*.xz
          prerelease: true
          generate_release_notes: true