name: Build OpenWrt
on:
  workflow_dispatch:
    inputs:
      board_version:
        description: 'Select device to compile'
        required: true
        default: 'HG680-P'
        type: choice
        options:
          - HG680-P
          - B860H

jobs:
  build:
    name: 🚀 Build ${{ github.event.inputs.board_version }}
    runs-on: ubuntu-22.04
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧬 Clone Builder
        run: |
          git clone --depth 1 https://github.com/ophub/amlogic-s9xxx-openwrt.git

      - name: 🩹 Patch Overlay
        run: |
          mkdir -p amlogic-s9xxx-openwrt/config/imagebuilder/files
          cp -r files/files/. amlogic-s9xxx-openwrt/config/imagebuilder/files/
          cat > amlogic-s9xxx-openwrt/config/imagebuilder/config <<'EOF'
          CONFIG_PACKAGE_tailscale=y
          CONFIG_PACKAGE_luci-app-tailscale-community=y
          CONFIG_PACKAGE_momo=y
          CONFIG_PACKAGE_luci-app-momo=y
          EOF

      - name: 🧩 Patch Partition
        run: |
          SBIN=amlogic-s9xxx-openwrt/make-openwrt/openwrt-files/common-files/usr/sbin
          cp -f patch/openwrt-install-amlogic "$SBIN/"
          cp -f patch/openwrt-tf "$SBIN/"
          chmod +x "$SBIN/openwrt-install-amlogic" "$SBIN/openwrt-tf"
          cp -f patch/imagebuilder.sh amlogic-s9xxx-openwrt/config/imagebuilder/imagebuilder.sh
          # coreutils 8.32 (jammy) lacks --update=none (9.x only); use -n equivalent
          sed -i 's/--update=none/-n/g' amlogic-s9xxx-openwrt/remake

      - name: 🏷️ Resolve Version
        run: |
          VER=$(curl -s https://downloads.openwrt.org/releases/ | grep -oE 'href="[0-9]+\.[0-9]+\.[0-9]+/"' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n1)
          echo "VER=$VER" >> $GITHUB_ENV
          echo "Resolved OpenWrt version: $VER"

      - name: 🍞 Bake Rootfs
        run: |
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y zstd make >/dev/null
          cd amlogic-s9xxx-openwrt
          export MOMO_FEED="https://momomomo.pages.dev/openwrt-$(echo "${{ env.VER }}" | cut -d. -f1-2)/aarch64_generic/momo"
          chmod +x config/imagebuilder/imagebuilder.sh
          ./config/imagebuilder/imagebuilder.sh openwrt:${{ env.VER }}

      - name: 📥 Stage Rootfs
        run: |
          mkdir -p amlogic-s9xxx-openwrt/openwrt-armsr
          cp amlogic-s9xxx-openwrt/output/*rootfs.tar.gz amlogic-s9xxx-openwrt/openwrt-armsr/

      - name: 🎯 Resolve Board
        run: |
          case "${{ github.event.inputs.board_version }}" in
            HG680-P) BOARD=s905x ;;
            B860H)   BOARD=s905x-b860h ;;
          esac
          echo "BOARD=$BOARD" >> $GITHUB_ENV

      - name: ⚙️ Compile
        run: |
          cd amlogic-s9xxx-openwrt
          sudo ./remake -b ${{ env.BOARD }} -s 1024

      - name: 🔍 Locate Image
        run: |
          FILE_PATH=$(find ./amlogic-s9xxx-openwrt/openwrt/out/ -name "*.img.gz" | sort -V | tail -n1)
          if [[ -z "$FILE_PATH" ]]; then
            echo "Error: Tidak ada file firmware ditemukan!"
            exit 1
          fi
          echo "FILE_PATH=$FILE_PATH" >> $GITHUB_ENV

      - name: 🧊 Recompress (xz)
        run: |
          IMG="${FILE_PATH%.gz}"
          sudo gunzip -k -f "$FILE_PATH"
          sudo xz -T0 -k -f "$IMG"
          sudo chmod 644 "${IMG}.xz"
          echo "FILE_PATH=${IMG}.xz" >> $GITHUB_ENV

      - name: 🏷️ Rename
        run: |
          BOARD=$(echo "${{ github.event.inputs.board_version }}" | tr '[:upper:]' '[:lower:]' | tr -d '-')
          KERNEL=$(basename "$FILE_PATH" | grep -oE 'k[0-9]+\.[0-9]+\.[0-9]+')
          FINAL="bits-wrt-${{ env.VER }}-${BOARD}-${KERNEL}.img.xz"
          DIR=$(dirname "$FILE_PATH")
          sudo mv "$FILE_PATH" "${DIR}/${FINAL}"
          echo "FILE_PATH=${DIR}/${FINAL}" >> $GITHUB_ENV

      - name: 🕒 Stamp Date
        id: set_date
        run: |
          export TZ='Asia/Jakarta'
          echo "date_time=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: 📝 Changelog
        run: |
          {
            echo "### Changelog"
            git log --oneline --no-merges -15 | sed 's/^/- /'
            echo ""
            echo "### BITS-WRT Information"
            echo "* Default IP: 20.20.20.20"
            echo "* Default username: root"
            echo "* Default password: bitswrt"
            echo "* Release date: ${{ env.date_time }}"
          } > /tmp/RELEASE_BODY.md

      - name: 🚀 Publish
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        with:
          name: BITS-WRT ${{ env.VER }} (${{ github.event.inputs.board_version }})
          tag_name: v${{ env.VER }}_${{ github.event.inputs.board_version }}
          draft: false
          prerelease: false
          files: |
                ${{ env.FILE_PATH }}
          body_path: /tmp/RELEASE_BODY.md