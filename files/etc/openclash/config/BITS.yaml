---
# BITS mirror momo — grup + rules selaras: Iklan, Streaming, Sosmed, AI, Indo, ISP.
# Data: GEOSITE standar (bawaan ipk) + RP-Indo remote. Tanpa GEOIP.
# Isi akun di proxy_provider/BITS.yaml, pilih di grup ISP.
port: 7890
socks-port: 7891
redir-port: 7892
tproxy-port: 7895
mixed-port: 7893
mode: rule
log-level: silent
allow-lan: true
external-controller: 0.0.0.0:9090
secret: bitswrt
bind-address: "*"
external-ui: "/usr/share/openclash/ui"
ipv6: false
dns:
  enable: true
  ipv6: false
  enhanced-mode: redir-host
  listen: 0.0.0.0:7874
  default-nameserver:
  - 1.1.1.1
  - 8.8.8.8
  nameserver:
  - 1.1.1.1
  - 8.8.8.8
proxy-groups:
- name: ISP
  type: select
  disable-udp: false
  proxies:
  - Best
  - Traffic-Indo
  - DIRECT
  url: http://www.gstatic.com/generate_204
  interval: 60
- name: Best
  type: url-test
  disable-udp: false
  use:
  - BITS
  url: http://www.gstatic.com/generate_204
  interval: 180
  tolerance: 100
- name: Traffic-Ads
  type: select
  disable-udp: false
  proxies:
  - REJECT
  - Best
  - DIRECT
- name: Traffic-Streaming
  type: select
  disable-udp: false
  proxies:
  - Best
  - DIRECT
- name: Traffic-Sosmed
  type: select
  disable-udp: false
  proxies:
  - Best
  - DIRECT
- name: Traffic-AI
  type: select
  disable-udp: false
  proxies:
  - Best
  - DIRECT
- name: Traffic-Indo
  type: select
  disable-udp: false
  proxies:
  - Best
  - DIRECT
proxy-providers:
  BITS:
    type: file
    path: "./proxy_provider/BITS.yaml"
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 180
rule-providers:
  RP-Indo:
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/rtaserver/Clash-Rule-IP-Indo/main/rule-indo.yaml"
    path: "./rule_provider/rp-indo.yaml"
    interval: 86400
    proxy: DIRECT
rules:
- DST-PORT,7890,REJECT
- DST-PORT,7891,REJECT
- DST-PORT,7892,REJECT
- DST-PORT,7895,REJECT
- IP-CIDR,198.18.0.0/15,REJECT,no-resolve
- RULE-SET,RP-Indo,Traffic-Indo
- DOMAIN-KEYWORD,pagead,Traffic-Ads
- DOMAIN-KEYWORD,adsystem,Traffic-Ads
- DOMAIN-KEYWORD,adservice,Traffic-Ads
- GEOSITE,netflix,Traffic-Streaming
- GEOSITE,disney,Traffic-Streaming
- GEOSITE,primevideo,Traffic-Streaming
- GEOSITE,spotify,Traffic-Streaming
- GEOSITE,tiktok,Traffic-Streaming
- DOMAIN-SUFFIX,hbo.com,Traffic-Streaming
- DOMAIN-SUFFIX,hbomax.com,Traffic-Streaming
- GEOSITE,facebook,Traffic-Sosmed
- GEOSITE,twitter,Traffic-Sosmed
- GEOSITE,telegram,Traffic-Sosmed
- DOMAIN-SUFFIX,instagram.com,Traffic-Sosmed
- DOMAIN-SUFFIX,cdninstagram.com,Traffic-Sosmed
- DOMAIN-KEYWORD,chatgpt,Traffic-AI
- DOMAIN-KEYWORD,openai,Traffic-AI
- DOMAIN-KEYWORD,claude,Traffic-AI
- DOMAIN-KEYWORD,gemini,Traffic-AI
- DOMAIN-KEYWORD,copilot,Traffic-AI
- DOMAIN-KEYWORD,perplexity,Traffic-AI
- DOMAIN-KEYWORD,deepseek,Traffic-AI
- GEOSITE,youtube,Traffic-Indo
- GEOSITE,whatsapp,Traffic-Indo
- GEOSITE,google,Traffic-Indo
- GEOSITE,private,DIRECT
- MATCH,ISP
