# BITS simple profile (fragment — port/DNS dari UCI mixin).
# Isi akun di /etc/nikki/run/proxy_provider/BITS.yaml, pilih di grup PROXY.
# Tanpa referensi GEOIP/GEOSITE -> tetap valid meski database geo belum terdownload.
proxy-groups:
- name: PROXY
  type: select
  disable-udp: false
  proxies:
  - DIRECT
  - REJECT
  use:
  - BITS
  url: http://www.gstatic.com/generate_204
  interval: 60
proxy-providers:
  BITS:
    type: file
    path: "./proxy_provider/BITS.yaml"
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 180
rules:
- DST-PORT,7890,REJECT
- DST-PORT,7891,REJECT
- DST-PORT,7892,REJECT
- IP-CIDR,198.18.0.1/16,REJECT,no-resolve
- MATCH,PROXY
