<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" role="img" aria-label="BITS-WRT">
  <!-- BITS-WRT mark — terminal prompt (> + cursor) on an accent tile.
       Teal tile + white glyph reads on both light and dark surfaces. -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0e7490"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#g)"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
  </defs>
  <polyline points="22,21 35,32 22,43" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="39" y="40" width="11" height="9" rx="2.5" fill="#ffffff"/>
</svg>